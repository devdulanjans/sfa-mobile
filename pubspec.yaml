name: sfa_mobile
description: Sales Force Automation Mobile Application
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP / Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3

  # Bluetooth printing — classic (SPP) thermal printers, not BLE
  print_bluetooth_thermal: ^1.2.1
  esc_pos_utils_plus: ^2.0.4

  # Location / GPS
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Navigation
  go_router: ^14.2.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # PDF / Printing
  pdf: ^3.11.0
  printing: ^5.12.0

  # Signature capture
  signature: ^6.3.0

  # Utilities
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  package_info_plus: ^8.0.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  equatable: ^2.0.5
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/icon/
